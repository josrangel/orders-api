spring:
  application:
    name: orders-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:orders-api-jwt-secret-1234567890-orders-api-jwt-secret-1234567890}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:orders-api-files}
      endpoint: ${AWS_S3_ENDPOINT:}