spring:
  application:
    name: orders-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}