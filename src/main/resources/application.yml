spring:
  application:
    name: orders-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${SPRING_DATASOURCE_USERNAME:orders_user}
    password: ${SPRING_DATASOURCE_PASSWORD:orders_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true